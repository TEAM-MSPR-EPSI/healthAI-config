services:
  # Base de données PostgreSQL
  database:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./healthAI-database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Agent PDC (Collecte de données pour Grafana)
  pdc_agent:
    image: grafana/pdc-agent:latest
    container_name: pdc_agent
    environment:
      - PDC_TOKEN=${PDC_TOKEN}
      - PDC_CLUSTER=${PDC_CLUSTER}
      - PDC_GRAFANA_ID=${PDC_GRAFANA_ID}
    command: >
      -token ${PDC_TOKEN}
      -cluster ${PDC_CLUSTER}
      -gcloud-hosted-grafana-id ${PDC_GRAFANA_ID}
    networks:
      - app_network
    depends_on:
      - database
    restart: unless-stopped

  # API Backend (Express / Node)
  api_backend:
    build:
      context: ./healthAI-backend-API
      dockerfile: Dockerfile
    container_name: api_backend
    env_file:
      - .env
    # ✅ Volumes live supprimés (l'image contient déjà le code)
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network
    # ✅ npm run dev → npm start (nodemon n'est plus dans l'image de prod)
    command: npm start
    restart: unless-stopped

  # ETL Backend (Python + FastAPI)
  etl_backend:
    build:
      context: ./healthAI-backend-ETL
      dockerfile: Dockerfile
    container_name: etl_backend
    env_file:
      - ./healthAI-backend-ETL/.env
    # ✅ Volume live supprimé (l'image contient déjà le code)
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Angular
  frontend:
    build:
      context: ./healthAI-frontend
      dockerfile: Dockerfile
    container_name: angular_frontend
    # ✅ Volumes supprimés (Nginx sert les fichiers compilés, pas Node.js)
    # ✅ command supprimée (Nginx démarre automatiquement)
    ports:
      - "4200:4200"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  # Base de données NoSQL MongoDB
  mongodb:
    image: mongo:7-jammy
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service de Recommandation Nutritionnelle (Python + FastAPI + HuggingFace)
  nutrition_service:
    build:
      context: ./healthAI-service-nutrition
      dockerfile: Dockerfile
    container_name: nutrition_service
    env_file:
      - ./healthAI-service-nutrition/.env
    environment:
      OMP_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      TRANSFORMERS_OFFLINE: "0"
    volumes:
      # On garde uniquement le cache HuggingFace (modèles IA, trop lourds à re-télécharger)
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - "8001:8001"
    depends_on:
      database:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Service de recommandations d'activités physiques (Python + FastAPI + Gemini)
  exercices_service:
    build:
      context: ./healthAI-service-exercices
      dockerfile: Dockerfile
    container_name: exercices_service
    env_file:
      - ./healthAI-service-exercices/.env
    # ✅ Volume live supprimé (l'image contient déjà le code)
    ports:
      - "8002:8002"
    depends_on:
      database:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Monitoring Grafana
  monitoring:
    image: grafana/grafana:latest
    container_name: grafana_monitoring
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - app_network
    depends_on:
      - database

volumes:
  postgres_data:
  grafana_data:
  mongodb_data:
  huggingface_cache:

networks:
  app_network:
    driver: bridge
services:
  # Base de données PostgreSQL
  database:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./healthAI-database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  #Agent PDC (Collecte de données pour Grafana)
  pdc_agent:
    image: grafana/pdc-agent:latest
    container_name: pdc_agent
    environment:
      - PDC_TOKEN=${PDC_TOKEN}
      - PDC_CLUSTER=${PDC_CLUSTER}
      - PDC_GRAFANA_ID=${PDC_GRAFANA_ID}
    command: >
      -token ${PDC_TOKEN}
      -cluster ${PDC_CLUSTER}
      -gcloud-hosted-grafana-id ${PDC_GRAFANA_ID}
    networks:
      - app_network
    depends_on:
      - database
    restart:
      unless-stopped

  # API Backend (Express / Node)
  api_backend:
    build:
      context: ./healthAI-backend-API
      dockerfile: Dockerfile
    container_name: api_backend
    env_file:
      - .env
    environment:
      - S3_ENDPOINT=http://minio:9000
      - APP_ACCESS_KEY=${APP_ACCESS_KEY:-app-access-key}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-app-secret-key}
      - PUBLIC_MEDIA_URL=http://localhost
    volumes:
      - ./healthAI-backend-API:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network
    command: npm run dev
    restart: unless-stopped

  # ETL Backend (Python + FastAPI)
  etl_backend:
    build:
      context: ./healthAI-backend-ETL
      dockerfile: Dockerfile
    container_name: etl_backend
    env_file:
      - ./healthAI-backend-ETL/.env
    volumes:
      - ./healthAI-backend-ETL:/app
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Angular
  frontend:
    build:
      context: ./healthAI-frontend
      dockerfile: Dockerfile
    container_name: angular_frontend
    volumes:
      - ./healthAI-frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - api_backend
    networks:
      - app_network
    command: npm start

  # Base de données NoSQL MongoDB (pour le moteur de recommandation)
  mongodb:
    image: mongo:7-jammy
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service de Recommandation Nutritionnelle (Python + FastAPI + HuggingFace)
  nutrition_service:
    build:
      context: ./healthAI-service-nutrition
      dockerfile: Dockerfile
    container_name: nutrition_service
    env_file:
      - ./healthAI-service-nutrition/.env
    volumes:
      - ./healthAI-service-nutrition:/app
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - "8001:8001"
    depends_on:
      database:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Service de recommandations d'activités physiques (Python + FastAPI + Gemini)
  exercices_service:
    build:
      context: ./healthAI-service-exercices
      dockerfile: Dockerfile
    container_name: exercices_service
    env_file:
      - ./healthAI-service-exercices/.env
    volumes:
      - ./healthAI-service-exercices:/app
    ports:
      - "8002:8002"
    depends_on:
      database:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Monitoring Grafana
  monitoring:
    image: grafana/grafana:latest
    container_name: grafana_monitoring
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - app_network
    depends_on:
      - database

  # ─────────────────────────────────────────────
  #  MinIO — Object Storage (S3-compatible)
  # ─────────────────────────────────────────────
  minio:
    build:
      context: ./healthAI-application-database
      dockerfile: Dockerfile
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
      MINIO_SITE_NAME: ${MINIO_SITE_NAME:-social-storage}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  # ─────────────────────────────────────────────
  #  MinIO Init — création des buckets & policies
  # ─────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
      APP_ACCESS_KEY: ${APP_ACCESS_KEY:-app-access-key}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-app-secret-key}
    volumes:
      - ./healthAI-application-database/scripts/init-buckets.sh:/init-buckets.sh:ro
      - ./healthAI-application-database/policies:/policies:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    networks:
      - app_network

  # ─────────────────────────────────────────────
  #  Nginx — reverse proxy + cache pour les médias
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: minio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./healthAI-application-database/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./healthAI-application-database/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app_network

volumes:
  postgres_data:
  grafana_data:
  mongodb_data:
  huggingface_cache:
  minio_data:
  nginx_cache:

networks:
  app_network:
    driver: bridge